name: spaGFM
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools>=61.0,<81
  - pip:
      - --index-url=https://download.pytorch.org/whl/cu126
      - --extra-index-url=https://pypi.org/simple
      - --find-links=https://data.pyg.org/whl/torch-2.10.0+cu126.html
      - torch==2.10.0
      - torchvision==0.25.0
      - torch_cluster
      - torch_geometric
      - torchmetrics
      - lightning
      - hydra-core
      - einops
      - scikit-learn
      - numpy
      - scipy
      - wandb
      - tqdm
      - h5py
      - anndata>=0.10.8,<0.11
      - scanpy
      - pandas>=1.3.5
      - pyarrow>=22.0.0
      - scvi-tools>=0.16.0,<1.0
      - jax>=0.4.3,<0.5
      - jaxlib>=0.4.3,<0.5
      - flax<0.9
      - optax<0.2.6
      - chex<0.1.90
      - orbax-checkpoint<0.6
      - mudata>=0.3,<0.4
      - numba>=0.55.1
      - scikit-misc>=0.1.4
      - umap-learn>=0.5.3
      - leidenalg>=0.8.10
      - datasets>=2.20.0,<3
      - torchdata>=0.11.0
      - lamin-dataloader>=0.2.0
      - ninja
      - typing-extensions>=4.2.0,<5.0.0
      - scib>=1.0.3,<2.0.0
      - cell-gears<0.0.3
      - orbax<0.1.8
      - ipython
      - -e ./scFM/scGPT
      - -e ./scFM/scConcept
