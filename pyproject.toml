[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaGFM"
version = "1.0.0"
description = "A scalable graph foundation model for spatial transcriptomics analyses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "einops",
    "numpy",
    "scikit-learn",
    "scipy",
    "torch>=2.0",
    "torch-cluster",
    "torch-geometric>=2.3",
    "torchmetrics",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
data = [
    "anndata>=0.10.8,<0.11",
    "pandas>=1.3.5",
    "scanpy",
]

[project.urls]
Homepage = "https://github.com/yzhong36/spaGFM"
Repository = "https://github.com/yzhong36/spaGFM"

[project.scripts]
spagfm-adata2pyg = "spaGFM.stRoamer.utils.CLI_adata2pyg:main"
spagfm-evaluate = "spaGFM.stRoamer.evaluation.CLI_evaluation:main"
spagfm-finetune = "spaGFM.stRoamer.training.CLI_run_train_ft:main"
spagfm-finetune-inference = "spaGFM.stRoamer.inference.CLI_run_inference_ft:main"
spagfm-inference = "spaGFM.stRoamer.inference.CLI_inference:main"
spagfm-plot-umap = "spaGFM.stRoamer.utils.CLI_plot_UMAP:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spaGFM*"]
namespaces = false
